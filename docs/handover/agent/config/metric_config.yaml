# =============================================================================
# CATS Scale + Revenue/FTE Ingestion Skill — Source & Goal Registry
# =============================================================================
# MVP scope: staging-only. This file is the single source of truth for WHERE
# data comes from and WHAT the approved goals are. The pipeline reads ONLY the
# sources listed here, and writes ONLY to `staging_target` below.
#
# RULES (from BUILD_PLAN.md §2, §3, §5):
#   - Never guess a source tab, header row, goal value, or grade mapping.
#   - Anything not yet confirmed by the owner MUST stay as the sentinel
#     `CONFIRM` (for values) or `null` (for header rows). The pipeline will emit
#     REVIEW/BLOCKED for that metric rather than fabricating a number.
#   - `spreadsheet_id`s listed here (and in safety.py FORBIDDEN_TARGETS) are
#     read-only. The writer refuses to target any of them.
# =============================================================================

version: 1
as_of_policy: "latest_completed_reporting_date"   # overridable per run via --as-of

# -----------------------------------------------------------------------------
# Where the staging output is written. This is the ONLY write target.
# Must be DISTINCT from every source/dashboard id (enforced in safety.py).
# -----------------------------------------------------------------------------
staging_target:
  # Default MVP writer: a brand-new local workbook, fully isolated from prod.
  kind: "local_xlsx"                 # one of: local_xlsx | google_sheet
  local_dir: "staging_output"
  # For google_sheet mode, set an explicit staging spreadsheet id that you own.
  # It must NOT appear in any source/dashboard list. Left null on purpose.
  google_spreadsheet_id: null
  tabs:
    output: "Staging Output"
    raw_rows: "Raw Rows"
    audit: "Run Audit"
    methodology: "Methodology"

# -----------------------------------------------------------------------------
# Credentials are referenced BY NAME only. Never inline secrets here.
# -----------------------------------------------------------------------------
credentials:
  google_sheets: "GOOGLE_SHEETS_CONNECTION"   # env var / secret-store key name
  warehouse: "WAREHOUSE_CONNECTION"
  scopes_readonly:
    - "https://www.googleapis.com/auth/spreadsheets.readonly"
    - "https://www.googleapis.com/auth/documents.readonly"
    - "https://www.googleapis.com/auth/drive.readonly"

